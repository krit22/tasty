name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/package.py

  examples-and-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.10', '1.27.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: python3 scripts/examples.py
      - run: python3 scripts/evaluate.py prove
      - run: go test ./...
        working-directory: examples/forward-options
      - run: go vet ./...
        working-directory: examples/forward-options
